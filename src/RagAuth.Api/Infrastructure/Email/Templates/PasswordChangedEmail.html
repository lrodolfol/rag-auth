<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua senha foi alterada</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 30px 10px;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0"
                       style="max-width: 500px; background-color: #ffffff; border-radius: 8px; padding: 35px;">

                    <tr>
                        <td align="center">
                            <h2 style="color: #222222; margin-top: 0;">
                                Sua senha foi alterada
                            </h2>
                        </td>
                    </tr>

                    <tr>
                        <td style="color: #555555; font-size: 15px; line-height: 1.6;">
                            <p>Olá, <strong>{{CLIENT_NAME}}</strong>!</p>

                            <p>
                                A senha da sua conta no {{APP_NAME}} foi alterada em {{CHANGED_AT}}.
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="color: #777777; font-size: 13px; line-height: 1.6;">
                            <p>
                                Se não foi você, solicite imediatamente a recuperação de senha e entre em contato com o suporte.
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="border-top: 1px solid #eeeeee;
                                   padding-top: 20px;
                                   text-align: center;
                                   color: #999999;
                                   font-size: 12px;">
                            © {{YEAR}} {{APP_NAME}}. Todos os direitos reservados.
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
